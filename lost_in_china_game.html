<!--
  The original code is "loaded" because:
  - The CSS is heavy/monolithic for a simple game.
  - Style and markup are tightly interwoven, lowering maintainability.
  - The game state/data, rendering, and logic are all in a long global script.
  - Most markup is static and can be rendered more simply, with less repetition.
  - Some CSS is over-engineered for such a mini-game.

  The refactor below:
  - Moves the CSS to only include necessary minimum style, with comments for future modularization or importing.
  - HTML markup is simplified and extraneous classes removed or reduced.
  - JavaScript logic is modularized, removes duplication, improves clarity, and groups related logic.
  - Keeps the game mechanics and experience identical for minimal impact but improves maintainability and perf.
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap');
  body { background: #ebf0f8; font-family: 'Space Mono', monospace; }
  .game-wrap {
    background: #f7f7fc;
    max-width: 430px; margin: 40px auto; border-radius: 16px; box-shadow: 0 6px 40px #b4c8df42;
    border: 1.5px solid #e5e8ef;
    overflow: hidden; position: relative;
    color: #3d4a73;
  }
  .scene-header { display: flex; justify-content: space-between; align-items: center; background: #e8f5fd; padding: 14px 17px 10px; }
  .chapter-tag { font-size: 11px; color: #79b1e2; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
  .stats-bar { display: flex; gap: 16px; }
  .stat-val.stat-money { color: #c8932e; } .stat-val.stat-energy { color: #34b4bf; } .stat-val.stat-stress { color: #e7696a; }

  .progress-bar { height: 3px; background: #d8e8fd; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #6ac3fd 0%, #52b581 100%); transition: width 0.35s; }

  .scene-area { padding: 26px 20px 18px; background: #f7f7fc;}
  .scene-illus { display: flex; gap: 16px; align-items: center; margin-bottom: 18px;}
  .scene-icon { font-size: 38px; } .scene-name { font-weight: bold; color: #3582c4; letter-spacing: 1px; }

  .situation-box { background: #e9f2fa; border-left: 4px solid #3582c4; padding: 11px 15px; border-radius: 0 7px 7px 0; color: #5584a6; font-size: 13px; margin-bottom: 13px; }
  .npc-box { display: flex; gap: 11px; align-items: flex-start; background: #fff; border: 1px solid #e5e8ef; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .npc-avatar { width: 43px; height: 43px; background: #e0e9f3; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 23px;}
  .npc-info { flex: 1; }
  .npc-name { font-size: 11px; color: #79b1e2; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; font-weight: 600;}
  .npc-chinese { font-family: 'Noto Serif SC', serif; font-size: 20px; color: #222; margin-bottom: 3px;}
  .npc-pinyin { font-size: 12px; color: #6ea7e0; margin-bottom: 2px; font-style: italic;}
  .npc-hint-btn { font-size: 10px; color: #347dbe; background: none; border: none; text-decoration: underline; cursor:pointer; }

  #hintBox { display:none; font-size:12px; color:#428aca; background:#e9f2fa; border-radius:7px; padding:8px 12px; margin-bottom:10px;}

  .choices-label { font-size: 11px; color: #6d7d9c; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600;}
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;}
  .choice-btn { background: #f0f6fe; border: 1px solid #c1def7; border-radius: 7px; padding: 10px 11px; cursor: pointer; font-size: 12px; color: #4d5996; text-align: left; display: flex; gap: 7px; font-weight: 600; }
  .choice-btn[disabled] { opacity:0.63 }
  .choice-btn.correct { border-color: #46b38a; color: #46b38a; background: #eafcf7;}
  .choice-btn.wrong { border-color: #e7696a; color: #e7696a; background: #fbeaea; }
  .choice-key { font-weight: bold; min-width: 14px; color: #3582c4;}
  .choice-btn.correct .choice-key { color: #46b38a; }
  .choice-btn.wrong .choice-key { color: #e7696a;}
  .word-bank, .sentence-slots { display: flex; gap: 7px; margin-bottom: 12px;}
  .word-bank { flex-wrap: wrap; }
  .word-bank:not(.active) { display: none;}
  .word-tile { background: #edf3fa; border: 1px solid #b2cef0; border-radius: 7px; padding: 7px 11px; font-size: 15px; color: #2765a3; cursor:pointer; font-family:'Noto Serif SC',serif; font-weight: 700; }
  .word-tile.placed { opacity:.35; cursor:default;}
  .sentence-slots { min-height: 35px; }
  .slot { border-bottom: 2px solid #b2cef0; min-width: 32px; padding: 5px 8px; font-size: 15px; color: #7aa6c2; font-family:'Noto Serif SC',serif; cursor:pointer; }
  .slot.filled { border-color: #3582c4; color: #264f83;}
  .check-btn { background: #edf3fa; border: 1px solid #b2cef0; color: #527ba7; font-size: 11px; padding: 7px 16px; border-radius: 7px; cursor: pointer; font-weight: 700; margin-bottom: 9px; }
  .check-btn:hover { border-color: #3582c4;}
  .feedback-box { display:none; padding: 10px 15px; border-radius: 9px; font-size: 13px; margin-bottom: 10px; }
  .feedback-box.show { display:block;}
  .feedback-box.correct-fb { background: #eafcf7; border:1px solid #54e7b2; color: #28b587;}
  .feedback-box.wrong-fb { background: #fff1f2; border:1px solid #eea9ac; color: #e7696a;}
  .next-btn { width: 100%; background: #79b1e2; border: 1px solid #3582c4; color: #fff; font-size: 12px; font-weight: bold; padding: 11px 2px; border-radius: 8px; cursor: pointer; margin-top: 1px; display: none; }
  .next-btn.show { display: block;}
  .scene-transition { position: absolute; inset:0; background: rgba(235,248,255,0.91); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 18px; z-index:10; opacity:0; pointer-events:none; transition: opacity .33s;}
  .scene-transition.show { opacity:1; pointer-events:all;}
  .trans-icon { font-size: 40px;}
  .trans-result {font-size:16px; font-weight:bold;}
  .trans-result.good { color: #46b38a; } .trans-result.bad {color:#e7696a;}
</style>

<div class="game-wrap" id="gameWrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="scene-header">
    <span class="chapter-tag" id="chapterTag"></span>
    <div class="stats-bar">
      <div class="stat"><span>💰</span><span class="stat-val stat-money" id="statMoney"></span></div>
      <div class="stat"><span>⚡</span><span class="stat-val stat-energy" id="statEnergy"></span></div>
      <div class="stat"><span>😰</span><span class="stat-val stat-stress" id="statStress"></span></div>
    </div>
  </div>

  <div class="scene-area">
    <div class="scene-illus">
      <span class="scene-icon" id="sceneIcon"></span>
      <span class="scene-name" id="sceneName"></span>
    </div>
    <div class="situation-box" id="situationBox"></div>
    <div class="npc-box">
      <div class="npc-avatar" id="npcAvatar"></div>
      <div class="npc-info">
        <div class="npc-name" id="npcName"></div>
        <div class="npc-chinese" id="npcChinese"></div>
        <div class="npc-pinyin" id="npcPinyin"></div>
        <button class="npc-hint-btn" onclick="toggleHint()">show meaning</button>
      </div>
    </div>
    <div id="hintBox"></div>
    <div class="word-bank" id="wordBank"></div>
    <div class="sentence-slots" id="sentenceSlots"></div>
    <button class="check-btn" id="checkBtn" onclick="checkBuild()" style="display:none">CHECK ↗</button>
    <div class="choices-label" id="choicesLabel"></div>
    <div class="choices" id="choicesDiv"></div>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextScene()">NEXT SITUATION →</button>
  </div>
  <div class="scene-transition" id="transOverlay">
    <div class="trans-icon" id="transIcon"></div>
    <div class="trans-result" id="transResult"></div>
    <div class="trans-msg" id="transMsg"></div>
  </div>
</div>

<script>
const scenes = [
  {
    chapter: "Chapter 1 • Airport",
    sceneIcon: "✈️",
    sceneName: "BEIJING AIRPORT",
    situation: "You just landed. The immigration officer looks at you and asks a question. You must answer to pass!",
    npcAvatar: "👮",
    npcName: "Immigration Officer",
    chinese: "你从哪里来？",
    pinyin: "Nǐ cóng nǎlǐ lái?",
    hint: '"Where do you come from?"',
    type: "choice",
    choices: [
      { text: "我来自巴基斯坦 — I am from Pakistan", correct: true },
      { text: "我很饿 — I am very hungry", correct: false },
      { text: "谢谢你 — Thank you very much", correct: false },
      { text: "我不知道 — I don't know", correct: false }
    ],
    correctFeedback: "✅ 我来自巴基斯坦 (Wǒ láizì Bājīsītǎn) — Correct! Officer stamps your passport.",
    wrongFeedback: "❌ Wrong answer! Officer signals security. You lose time & energy.",
    correctEffect: { money: 0, energy: 0, stress: -5 },
    wrongEffect: { money: -50, energy: -15, stress: 20 }
  },
  {
    chapter: "Chapter 1 • Airport",
    sceneIcon: "🧳",
    sceneName: "LUGGAGE CLAIM",
    situation: "Your bag didn't come out! You need to talk to the baggage officer and explain your problem.",
    npcAvatar: "🙍",
    npcName: "Baggage Officer",
    chinese: "您好，有什么问题吗？",
    pinyin: "Nínhǎo, yǒu shénme wèntí ma?",
    hint: '"Hello, do you have a problem?"',
    type: "choice",
    choices: [
      { text: "我的行李丢了 — My luggage is lost", correct: true },
      { text: "我要买票 — I want to buy a ticket", correct: false },
      { text: "在哪里吃饭？ — Where to eat?", correct: false },
      { text: "不，没问题 — No, no problem", correct: false }
    ],
    correctFeedback: "✅ 我的行李丢了 (Wǒ de xíngli diū le) — They start a lost bag report! You're moving forward.",
    wrongFeedback: "❌ The officer is confused. You wasted 30 minutes.",
    correctEffect: { money: 0, energy: -5, stress: 0 },
    wrongEffect: { money: 0, energy: -20, stress: 15 }
  },
  {
    chapter: "Chapter 2 • Street Food",
    sceneIcon: "🍜",
    sceneName: "STREET FOOD STALL",
    situation: "You're starving! A vendor is selling hot noodles. You need to order and tell them — NO SPICY!",
    npcAvatar: "👨‍🍳",
    npcName: "Noodle Vendor",
    chinese: "要什么？辣的还是不辣？",
    pinyin: "Yào shénme? Là de háishi bù là?",
    hint: '"What do you want? Spicy or not spicy?"',
    type: "build",
    words: ["不", "要", "辣", "一碗", "面条"],
    answer: ["一碗", "面条", "不", "要", "辣"],
    correctFeedback: "✅ 一碗面条不要辣 — Perfect! A hot bowl of noodles appears. +20 energy!",
    wrongFeedback: "❌ You got a bowl of fire-hot noodles. Stress goes up!",
    correctEffect: { money: -20, energy: 20, stress: -10 },
    wrongEffect: { money: -20, energy: 5, stress: 15 }
  },
  {
    chapter: "Chapter 3 • Taxi",
    sceneIcon: "🚕",
    sceneName: "TAXI STAND",
    situation: "You need to reach the hotel. The driver asks where you want to go. Choose the correct phrase!",
    npcAvatar: "🚗",
    npcName: "Taxi Driver",
    chinese: "去哪儿啊？",
    pinyin: "Qù nǎr a?",
    hint: '"Where are you going?"',
    type: "choice",
    choices: [
      { text: "去北京饭店，谢谢 — To Beijing Hotel, thank you", correct: true },
      { text: "我不会中文 — I don't know Chinese", correct: false },
      { text: "多少钱？— How much?", correct: false },
      { text: "请停车 — Please stop the car", correct: false }
    ],
    correctFeedback: "✅ 去北京饭店！Driver nods and starts driving. Great survival!",
    wrongFeedback: "❌ The driver is confused. You ended up on the wrong side of Beijing!",
    correctEffect: { money: -60, energy: 0, stress: -10 },
    wrongEffect: { money: -120, energy: -10, stress: 25 }
  }
];

let state = {
  current: 0,
  stats: { money: 500, energy: 100, stress: 0 },
  buildAnswer: [],
  buildWords: [],
  answered: false
};

function byId(id){ return document.getElementById(id);}
function setText(id, val){ byId(id).textContent = val; }

function renderScene() {
  const s = scenes[state.current];
  state.answered = false;

  setText('chapterTag', s.chapter);
  setText('sceneIcon', s.sceneIcon);
  setText('sceneName', s.sceneName);
  byId('situationBox').innerHTML = '<strong>Situation:</strong> ' + s.situation;
  setText('npcAvatar', s.npcAvatar);
  setText('npcName', s.npcName);
  setText('npcChinese', s.chinese);
  setText('npcPinyin', s.pinyin);

  byId('hintBox').style.display = 'none';
  byId('hintBox').innerHTML = '💡 This means: <span style="color:#1465b2">' + s.hint + '</span>';
  byId('feedbackBox').className = 'feedback-box';
  byId('feedbackBox').innerHTML = '';
  byId('nextBtn').className = 'next-btn';

  // Progress fill
  byId('progressFill').style.width = ((state.current / scenes.length) * 100) + '%';

  // Reset interaction UI
  byId('choicesLabel').style.display = 'none';
  byId('choicesDiv').style.display = 'none';
  byId('wordBank').className = 'word-bank';
  byId('wordBank').innerHTML = '';
  byId('sentenceSlots').style.display = 'none';
  byId('sentenceSlots').innerHTML = '';
  byId('checkBtn').style.display = 'none';

  if (s.type === 'choice') {
    setText('choicesLabel', 'CHOOSE YOUR RESPONSE:');
    byId('choicesLabel').style.display = 'block';
    byId('choicesDiv').style.display = 'grid';
    byId('choicesDiv').innerHTML = '';
    const keys = "ABCD".split('');
    s.choices.forEach((c,i)=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-key">${keys[i]}</span><span>${c.text}</span>`;
      btn.onclick = ()=> selectChoice(i);
      byId('choicesDiv').appendChild(btn);
    });
  }
  else if(s.type==='build'){
    setText('choicesLabel', 'BUILD THE CORRECT SENTENCE:');
    byId('choicesLabel').style.display = 'block';
    byId('wordBank').className = 'word-bank active';
    byId('sentenceSlots').style.display = 'flex';
    byId('checkBtn').style.display = 'inline-block';
    state.buildAnswer = [];
    state.buildWords = [...s.words];
    renderBuild();
  }

  updateStats();
}

function renderBuild() {
  const s = scenes[state.current];
  // Render word tiles
  const wb = byId('wordBank');
  wb.innerHTML = '';
  state.buildWords.forEach((w, i) => {
    const tile = document.createElement('div');
    tile.className = 'word-tile' + (state.buildAnswer.includes(i) ? ' placed' : '');
    tile.textContent = w;
    tile.onclick = ()=>{ if(!state.buildAnswer.includes(i) && !state.answered){ state.buildAnswer.push(i); renderBuild();} };
    wb.appendChild(tile);
  });
  // Render slots
  const slots = byId('sentenceSlots');
  slots.innerHTML = '';
  state.buildAnswer.forEach((wi,pos)=>{
    const slot = document.createElement('div');
    slot.className = 'slot filled';
    slot.textContent = state.buildWords[wi];
    slot.onclick = ()=>{ if(!state.answered){ state.buildAnswer.splice(pos,1); renderBuild();}};
    slots.appendChild(slot);
  });
  if(state.buildAnswer.length===0){
    const placeholder = document.createElement('div');
    placeholder.className = 'slot';
    placeholder.textContent = '点击词语...';
    placeholder.style.fontSize = '12px'; placeholder.style.color = '#a4bfd7';
    slots.appendChild(placeholder);
  }
}

function selectChoice(i) {
  if (state.answered) return;
  const s = scenes[state.current];
  state.answered = true;
  const btns = byId('choicesDiv').querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);
  btns[i].className = 'choice-btn ' + (s.choices[i].correct ? 'correct' : 'wrong');
  if (!s.choices[i].correct) {
    s.choices.forEach((c,j)=>{ if(c.correct) btns[j].className = 'choice-btn correct'; });
  }
  applyFeedback(s.choices[i].correct);
}

function checkBuild() {
  if (state.answered) return;
  const s = scenes[state.current];
  const user = state.buildAnswer.map(i=>state.buildWords[i]);
  const correct = JSON.stringify(user) === JSON.stringify(s.answer);
  state.answered = true;
  applyFeedback(correct);
}

function applyFeedback(correct){
  const s = scenes[state.current];
  const effect = correct ? s.correctEffect : s.wrongEffect;
  const stats = state.stats;
  stats.money = Math.max(0, stats.money + effect.money);
  stats.energy = Math.max(0, Math.min(100, stats.energy + effect.energy));
  stats.stress = Math.max(0, Math.min(100, stats.stress + effect.stress));
  updateStats();
  const fb = byId('feedbackBox');
  fb.className = 'feedback-box show ' + (correct?'correct-fb':'wrong-fb');
  fb.textContent = correct ? s.correctFeedback : s.wrongFeedback;
  byId('nextBtn').className = 'next-btn show';
}

function updateStats() {
  const {money, energy, stress} = state.stats;
  setText('statMoney', '¥'+money);
  setText('statEnergy', energy+'%');
  setText('statStress', stress+'%');
}

function toggleHint() {
  const h = byId('hintBox');
  h.style.display = (h.style.display==='none'||!h.style.display)?'block':'none';
}

function nextScene() {
  state.current++;
  if (state.current >= scenes.length) {
    showEndScreen();
    return;
  }
  const overlay = byId('transOverlay');
  const s = scenes[state.current];
  setText('transIcon', s.sceneIcon);
  setText('transResult', 'Moving to next location...');
  setText('transMsg', s.sceneName);
  overlay.className = 'scene-transition show';
  setTimeout(() => {
    overlay.className = 'scene-transition';
    renderScene();
  }, 1200);
}

function showEndScreen(){
  const wrap = byId('gameWrap');
  const stats = state.stats;
  const survived = stats.energy > 20 && stats.stress < 80;
  wrap.innerHTML = `
    <div style="min-height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; padding:32px; text-align:center; background:#f7f7fc; border-radius:18px; font-family:'Space Mono',monospace;">
      <div style="font-size:48px;">${survived ? '🏆' : '😵'}</div>
      <div style="font-size:18px; font-weight:700; color:${survived ? '#28b587' : '#e7696a'};">${survived ? 'YOU SURVIVED CHINA!' : 'GAME OVER — TRY AGAIN!'}</div>
      <div style="font-size:13px; color:#6ea7e0; line-height:1.8;">
        Final Stats: 💰 ¥${stats.money} • ⚡ ${stats.energy}% • 😰 ${stats.stress}%<br>
        You completed all ${scenes.length} survival scenarios.<br>
        你很棒！(Nǐ hěn bàng!) — You're amazing!
      </div>
      <div style="font-size:12px; color:#428aca; max-width:300px; line-height:1.7;">Words learned: 你从哪里来 · 我来自 · 行李丢了 · 不要辣 · 去哪儿 · 面条</div>
      <button onclick="location.reload()" style="margin-top:14px; background:#79b1e2; border:1.3px solid #3d79bf; color:#fff; font-family:'Space Mono',monospace; font-size:12px; font-weight:700; padding:10px 24px; border-radius:8px; cursor:pointer; letter-spacing:1px;">PLAY AGAIN ↺</button>
    </div>`;
}

// Initial render
renderScene();
</script>
